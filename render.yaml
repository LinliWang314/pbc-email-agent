services:
  - type: web
    name: pbc-email-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set in the Render dashboard, not committed
      - key: PYTHON_VERSION
        value: "3.11.9"
